# PPSSPP v1.20.4/macOS diagnostic override.
# Use with --appendconfig=/absolute/path/to/this/file and -j.
# JIT fast-memory access can crash in some OpenOMF gameplay scenarios.
# Keep memory checks strict: ignoring bad guest reads can hide real bugs.
# This override leaves your ordinary PPSSPP user config untouched.
[General]
IgnoreBadMemAccess = False
[CPU]
FastMemoryAccess = False
