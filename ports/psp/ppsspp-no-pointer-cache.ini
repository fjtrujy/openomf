# PPSSPP v1.20.4/macOS ARM64 diagnostic workaround.
# Retain classic JIT and fast memory, but disable its cached-pointer
# load/store optimization (JitDisable::CACHE_POINTERS = 0x01000000).
# This is an emulator-only workaround, not a fix for the underlying bug.
[General]
IgnoreBadMemAccess = False
[CPU]
FastMemoryAccess = True
JitDisableFlags = 0x01000000
