name: PSP

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master, new_psp]

jobs:
  psp:
    name: Build PSP EBOOT
    runs-on: ubuntu-24.04
    container:
      image: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v7
      - name: Install host build tools
        run: |
          apk add --no-cache build-base cmake ninja curl unzip zip
      - name: Build EBOOT
        run: |
          psp-cmake -S ports/psp -B build/psp -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/psp --parallel "$(nproc)"
          test -s build/psp/EBOOT.PBP
      - name: Package PSP game
        run: |
          sh ports/psp/package.sh build/psp
          test -s build/psp/PSP/GAME/OpenOMF/EBOOT.PBP
          cd build/psp
          zip -qr openomf-psp.zip PSP
      - uses: actions/upload-artifact@v7
        with:
          path: build/psp/openomf-psp.zip
          archive: false
          if-no-files-found: error
